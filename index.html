<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Marilyn | Sun, Rose & Blue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="canvas"></canvas>

<div class="card">
    <div class="name">MARILYN</div>
    <div class="line">☀️ like sunlight on the sea ☀️</div>
    <div class="line">🌹 roses for you, always 🌹</div>
    <div class="line">💙 blue is the color of my heart for you 💙</div>
    
    <div class="heartZone">
        <div class="bigHeart" id="clickHeart">💙</div>
        <div class="msgBox" id="msgBox">❤️ touch the heart ❤️</div>
    </div>

    <div class="buttons">
        <button id="rosesBtn">🌹 ROSES 🌹</button>
        <button id="sunBtn">☀️ SUN RAYS ☀️</button>
        <button id="blueHeartBtn">💙 BLUE HEARTS 💙</button>
    </div>
    
    <div class="footer">for marilyn · from the heart</div>
</div>

<script src="script.js"></script>
</body>
</html>
