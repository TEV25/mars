<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Marilyn | Eternal Love</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="effect-canvas"></canvas>

<div class="galactic-card">
    <div class="her-name">MARILYN</div>
    <div class="motto">✦ the only galaxy my heart orbits ✦</div>

    <div class="poetry-box">
        <div class="typewriter" id="typewriterText"></div>
    </div>

    <div class="interactive-zone">
        <div class="giant-heart" id="clickHeart">💖</div>
        <div class="reaction-message" id="loveResponse">❤️ tap the heart ❤️</div>
    </div>

    <div class="action-group">
        <button class="spark-btn" id="roseStormBtn">🌹 ROSE STORM 🌹</button>
        <button class="spark-btn" id="heartAvalancheBtn">💕 HEART AVALANCHE 💕</button>
    </div>
    <footer>⚡ every beat whispers your name, marilyn ⚡</footer>
</div>

<script src="script.js"></script>
</body>
</html>
